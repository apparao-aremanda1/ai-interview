<!-- Add hidden file inputs right above the closing </main> tag -->
<input type="file" id="jdFileInput" accept=".pdf,.txt" style="display: none;" onchange="handleJDUpload(event)" />
<input type="file" id="resumeFileInput" accept=".pdf,.docx,.txt" style="display: none;" onchange="handleResumeUpload(event)" />

<script>
  // 1. Trigger the hidden file inputs when the buttons are clicked
  function simulateParseJD() {
    document.getElementById('jdFileInput').click();
  }

  function simulateParseResume() {
    document.getElementById('resumeFileInput').click();
  }

  // 2. Handle the JD File Upload and AI Parsing
  async function handleJDUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const loader = document.getElementById('loaderJD');
    const text = document.getElementById('textJD');
    const btn = document.getElementById('btnParseJD');
    
    loader.style.display = 'block';
    text.innerText = 'AI is reading JD...';

    const formData = new FormData();
    formData.append("file", file);

    try {
      // Send to your local Python backend
      const response = await fetch("http://127.0.0.1:8000/api/parse-jd", {
        method: "POST",
        body: formData
      });
      
      const data = await response.json();

      // Auto-fill the form with AI results
      document.getElementById('jobRole').value = data.job_role || '';
      document.getElementById('seniority').value = data.seniority || '';
      document.getElementById('roundType').value = data.interview_type || '';
      document.getElementById('techStack').value = data.tech_stack || '';
      // Default voice selection
      document.getElementById('voice').value = 'Indian Voice (English)';
      
      loader.style.display = 'none';
      text.innerText = 'JD Parsed Successfully ✅';
      btn.className = 'flex items-center gap-2 bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold px-5 py-2.5 rounded-lg transition';
    } catch (error) {
      console.error("Error parsing JD:", error);
      loader.style.display = 'none';
      text.innerText = 'Error parsing JD ❌';
    }
  }

  // 3. Handle the Resume File Upload and AI Parsing
  async function handleResumeUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const loader = document.getElementById('loaderResume');
    const text = document.getElementById('textResume');
    const btn = document.getElementById('btnParseResume');
    
    loader.style.display = 'block';
    text.innerText = 'Extracting Details...';

    const formData = new FormData();
    formData.append("file", file);

    try {
      const response = await fetch("http://127.0.0.1:8000/api/parse-resume", {
        method: "POST",
        body: formData
      });
      
      const data = await response.json();

      // Auto-fill the form with AI results
      document.getElementById('candidateName').value = data.candidate_name || '';
      document.getElementById('candidateMobile').value = data.mobile_number || '';
      document.getElementById('candidateEmail').value = data.email_id || '';
      
      loader.style.display = 'none';
      text.innerText = 'Resume Parsed Successfully ✅';
      btn.className = 'flex items-center gap-2 bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold px-5 py-2.5 rounded-lg transition';
    } catch (error) {
      console.error("Error parsing Resume:", error);
      loader.style.display = 'none';
      text.innerText = 'Error parsing Resume ❌';
    }
  }
</script>

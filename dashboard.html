<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HR Dashboard | Kovi AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; } /* Light slate background */
    /* Loading spinner animation updated for light mode */
    .loader {
      border: 3px solid rgba(0, 0, 0, 0.1);
      border-top-color: #3b82f6; /* Blue spinner */
      border-radius: 50%;
      width: 18px;
      height: 18px;
      animation: spin 1s linear infinite;
      display: none;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="text-slate-800 min-h-screen">

  <!-- Top Navbar -->
  <header class="border-b border-slate-200 bg-white/90 sticky top-0 z-50 shadow-sm backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="flex items-center space-x-3">
          <div class="h-8 w-8 rounded-lg bg-gradient-to-tr from-blue-500 to-indigo-600 flex items-center justify-center font-bold text-white text-sm">K</div>
          <span class="text-lg font-bold text-slate-900">Kovi<span class="text-blue-600">.ai</span></span>
        </a>
        <span class="text-xs bg-slate-100 text-slate-600 border border-slate-200 px-2 py-0.5 rounded ml-2 font-medium">HR Dashboard</span>
      </div>
      <a href="index.html" class="text-sm text-slate-500 hover:text-slate-800 transition flex items-center gap-1 font-medium">
        &larr; Back to Home
      </a>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto px-6 py-10 space-y-8">

    <!-- Upload & Parse Section -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
      
      <!-- JD Upload Box -->
      <div class="bg-white border-2 border-dashed border-slate-300 rounded-xl p-5 flex flex-col items-center justify-center text-center hover:border-blue-400 transition shadow-sm">
        <div class="text-3xl mb-2">📄</div>
        <h3 class="text-slate-800 font-semibold text-sm mb-1">Step 1: Upload Job Description</h3>
        <p class="text-slate-500 text-xs mb-4">Auto-fill role, seniority & tech stack</p>
        <button id="btnParseJD" onclick="simulateParseJD()" class="flex items-center gap-2 bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-700 text-xs font-semibold px-4 py-2 rounded-lg transition">
          <div id="loaderJD" class="loader"></div>
          <span id="textJD">Upload & Parse JD</span>
        </button>
      </div>

      <!-- Resume Upload Box -->
      <div class="bg-white border-2 border-dashed border-slate-300 rounded-xl p-5 flex flex-col items-center justify-center text-center hover:border-blue-400 transition shadow-sm">
        <div class="text-3xl mb-2">🧑‍💻</div>
        <h3 class="text-slate-800 font-semibold text-sm mb-1">Step 2: Upload Candidate Resume</h3>
        <p class="text-slate-500 text-xs mb-4">Auto-fill candidate name & contact info</p>
        <button id="btnParseResume" onclick="simulateParseResume()" class="flex items-center gap-2 bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-700 text-xs font-semibold px-4 py-2 rounded-lg transition">
          <div id="loaderResume" class="loader"></div>
          <span id="textResume">Upload & Parse Resume</span>
        </button>
      </div>

    </div>

    <!-- The Custom AI Interview Engine Form -->
    <div class="bg-white border border-slate-200 rounded-2xl p-8 shadow-md">
      <div class="text-center mb-8">
        <h2 class="text-xl font-bold text-slate-900">Custom AI Interview Engine</h2>
        <p class="text-slate-500 text-xs mt-1">Review auto-filled parameters and click 'Start Interview'.</p>
      </div>

      <div class="space-y-5">
        
        <!-- Row 1 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Job Role</label>
            <input type="text" id="jobRole" class="w-full bg-white border border-slate-300 rounded-lg px-4 py-2.5 text-sm text-slate-900 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition shadow-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Hiring Manager Email</label>
            <input type="email" id="hmEmail" value="apparaoareamanda@gmail.com" class="w-full bg-white border border-slate-300 rounded-lg px-4 py-2.5 text-sm text-slate-900 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition shadow-sm" />
          </div>
        </div>

        <!-- Row 2 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5 border-t border-slate-200 pt-5">
          <div>
            <label class="block text-xs font-bold text-blue-600 uppercase tracking-wider mb-1.5">Candidate Name</label>
            <input type="text" id="candidateName" class="w-full bg-white border border-slate-300 rounded-lg px-4 py-2.5 text-sm text-slate-900 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition shadow-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold text-blue-600 uppercase tracking-wider mb-1.5">Mobile #</label>
            <input type="text" id="candidateMobile" class="w-full bg-white border border-slate-300 rounded-lg px-4 py-2.5 text-sm text-slate-900 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition shadow-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold text-blue-600 uppercase tracking-wider mb-1.5">Mail ID</label>
            <input type="email" id="candidateEmail" class="w-full bg-white border border-slate-300 rounded-lg px-4 py-2.5 text-sm text-slate-900 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition shadow-sm" />
          </div>
        </div>

        <!-- Row 3 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Interviewer Name (AI)</label>
            <input type="text" id="aiName" value="Badri" class="w-full bg-white border border-slate-300 rounded-lg px-4 py-2.5 text-sm text-slate-900 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition shadow-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Designation / Seniority</label>
            <select id="seniority" class="w-full bg-white border border-slate-300 rounded-lg px-4 py-2.5 text-sm text-slate-900 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition shadow-sm">
              <option value="">Select...</option>
              <option value="Software Engineer (SE)">Software Engineer (SE)</option>
              <option value="Senior Software Engineer (SSE)">Senior Software Engineer (SSE)</option>
              <option value="Lead Engineer">Lead Engineer</option>
            </select>
          </div>
        </div>

        <!-- Row 4 -->
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Interview Type</label>
          <select id="roundType" class="w-full bg-white border border-slate-300 rounded-lg px-4 py-2.5 text-sm text-slate-900 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition shadow-sm">
            <option value="">Select...</option>
            <option value="Technical Deep Dive">Technical Deep Dive</option>
            <option value="System Design">System Design</option>
          </select>
        </div>

        <!-- Row 5 -->
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Tech Stack & Key Topics (Comma Separated)</label>
          <input type="text" id="techStack" class="w-full bg-white border border-slate-300 rounded-lg px-4 py-2.5 text-sm text-slate-900 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition shadow-sm" />
        </div>

        <!-- Row 6 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 items-end pt-2">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Interviewer Voice</label>
            <select id="voice" class="w-full bg-white border border-slate-300 rounded-lg px-4 py-2.5 text-sm text-slate-900 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition shadow-sm">
              <option value="">Select Voice...</option>
              <option value="Indian Voice (English)">Indian Voice (English)</option>
              <option value="US Female (English)">US Female (English)</option>
              <option value="UK Male (English)">UK Male (English)</option>
            </select>
          </div>
          
          <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition shadow-md shadow-blue-500/30">
            Start Interview
          </button>
        </div>

      </div>
    </div>

  </main>

  <script>
    // These functions simulate sending the JD/Resume to your FastAPI backend
    function simulateParseJD() {
      const loader = document.getElementById('loaderJD');
      const text = document.getElementById('textJD');
      
      loader.style.display = 'block';
      text.innerText = 'Parsing with AI...';

      // Simulate a 1.5 second network request to your Python backend
      setTimeout(() => {
        document.getElementById('jobRole').value = 'Backend Developer';
        document.getElementById('seniority').value = 'Software Engineer (SE)';
        document.getElementById('roundType').value = 'Technical Deep Dive'; // Updated to match new option
        document.getElementById('techStack').value = 'Python, FastAPI, LangGraph, PostgreSQL';
        document.getElementById('voice').value = 'Indian Voice (English)';
        
        loader.style.display = 'none';
        text.innerText = 'JD Parsed Successfully ✅';
        
        const btn = document.getElementById('btnParseJD');
        btn.classList.remove('bg-slate-100', 'text-slate-700', 'hover:bg-slate-200');
        btn.classList.add('bg-emerald-500', 'text-white', 'hover:bg-emerald-600', 'border-emerald-600');
      }, 1500);
    }

    function simulateParseResume() {
      const loader = document.getElementById('loaderResume');
      const text = document.getElementById('textResume');
      
      loader.style.display = 'block';
      text.innerText = 'Extracting data...';

      // Simulate a 1.5 second network request to your Python backend
      setTimeout(() => {
        document.getElementById('candidateName').value = 'John Doe';
        document.getElementById('candidateMobile').value = '+91 98765 43210';
        document.getElementById('candidateEmail').value = 'john.doe@example.com';
        
        loader.style.display = 'none';
        text.innerText = 'Resume Parsed Successfully ✅';
        
        const btn = document.getElementById('btnParseResume');
        btn.classList.remove('bg-slate-100', 'text-slate-700', 'hover:bg-slate-200');
        btn.classList.add('bg-emerald-500', 'text-white', 'hover:bg-emerald-600', 'border-emerald-600');
      }, 1500);
    }
  </script>
</body>
</html>

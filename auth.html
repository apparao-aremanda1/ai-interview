<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Portal - Login / Signup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-2xl">
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-indigo-600 rounded-xl mb-3 shadow-lg shadow-indigo-500/30">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">AI Interview Platform</h1>
            <p class="text-sm text-slate-400 mt-1" id="subHeader">Log in to manage your branch candidates</p>
        </div>

        <!-- Toggle Switch -->
        <div class="flex bg-slate-900/60 p-1 rounded-xl mb-6 border border-slate-700/50">
            <button id="loginTab" onclick="switchTab('login')" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white transition">Log In</button>
            <button id="signupTab" onclick="switchTab('signup')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition">Sign Up</button>
        </div>

        <!-- Feedback Alert -->
        <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

        <!-- Auth Form -->
        <form id="authForm" onsubmit="handleSubmit(event)" class="space-y-4">
            <!-- Company Name (Signup Only) -->
            <div id="companyField" class="hidden">
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Company Name</label>
                <input type="text" id="companyName" placeholder="e.g. Acme Corp" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            </div>

            <!-- Branch Name (Signup Only) -->
            <div id="branchField" class="hidden">
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Branch / Location</label>
                <input type="text" id="branchName" placeholder="e.g. Hyderabad" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            </div>

            <!-- Email -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Company Email ID</label>
                <input type="email" id="email" required placeholder="recruiter@company.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            </div>

            <!-- Password -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-indigo-600/30 text-sm mt-2">
                Log In
            </button>
        </form>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000";
        let currentMode = "login";

        function switchTab(mode) {
            currentMode = mode;
            const companyField = document.getElementById("companyField");
            const branchField = document.getElementById("branchField");
            const loginTab = document.getElementById("loginTab");
            const signupTab = document.getElementById("signupTab");
            const submitBtn = document.getElementById("submitBtn");
            const subHeader = document.getElementById("subHeader");
            const alertBox = document.getElementById("alertBox");

            alertBox.classList.add("hidden");

            if (mode === "signup") {
                companyField.classList.remove("hidden");
                branchField.classList.remove("hidden");
                document.getElementById("companyName").required = true;
                document.getElementById("branchName").required = true;

                signupTab.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white transition";
                loginTab.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition";
                submitBtn.innerText = "Create Account";
                subHeader.innerText = "Register your branch to begin automated interviews";
            } else {
                companyField.classList.add("hidden");
                branchField.classList.add("hidden");
                document.getElementById("companyName").required = false;
                document.getElementById("branchName").required = false;

                loginTab.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white transition";
                signupTab.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition";
                submitBtn.innerText = "Log In";
                subHeader.innerText = "Log in to manage your branch candidates";
            }
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const submitBtn = document.getElementById("submitBtn");
            const alertBox = document.getElementById("alertBox");
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            submitBtn.disabled = true;
            submitBtn.innerText = "Processing...";
            alertBox.classList.add("hidden");

            const url = currentMode === "signup" ? `${API_BASE}/api/auth/signup` : `${API_BASE}/api/auth/login`;
            const payload = currentMode === "signup" ? {
                company_name: document.getElementById("companyName").value,
                branch_name: document.getElementById("branchName").value,
                email: email,
                password: password
            } : {
                email: email,
                password: password
            };

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Authentication failed.");
                }

                // Store session details
                localStorage.setItem("access_token", data.access_token);
                localStorage.setItem("company_name", data.company_name);
                localStorage.setItem("branch_name", data.branch_name);
                localStorage.setItem("email", data.email);

                // Redirect to dashboard[cite: 2]
                window.location.href = "dashboard.html";

            } catch (err) {
                alertBox.innerText = err.message;
                alertBox.className = "mb-4 p-3 rounded-lg text-sm font-medium bg-red-900/40 text-red-300 border border-red-800";
                alertBox.classList.remove("hidden");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = currentMode === "signup" ? "Create Account" : "Log In";
            }
        }
    </script>
</body>
</html>
